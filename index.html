<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WADI IT Technology - Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        slate: { 850: '#152033', 900: '#0f172a' }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .fade-in { animation: fadeIn 0.3s ease forwards; opacity: 0; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .stagger-1 { animation-delay: 100ms; }
        .stagger-2 { animation-delay: 200ms; }
        .stagger-3 { animation-delay: 300ms; }
        
        /* Dashboard Banner Gradient */
        .tech-banner {
            background: linear-gradient(135deg, rgba(15,23,42,0.9) 0%, rgba(30,58,138,0.8) 100%), url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover;
        }

        /* Print Media Queries for A4 PDF Output */
        @media print {
            @page { size: A4; margin: 0; }
            body { 
                background: white; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            header, aside, #mobileOverlay, #toastArea, .no-print, footer { display: none !important; }
            .flex-1.overflow-hidden { overflow: visible !important; }
            
            body.printing-modal main { display: none !important; } 
            body:not(.printing-modal) #voucherModal { display: none !important; }
            
            #voucherModal {
                position: absolute !important;
                left: 0 !important; top: 0 !important;
                width: 100% !important; height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                background: white !important;
            }
            #voucherModal > div:first-child { display: none !important; } /* overlay */
            #voucherModal > div.relative {
                box-shadow: none !important;
                width: 100% !important;
                max-width: none !important;
                display: block !important; /* Block is required for page breaks to work */
            }
            #modalContent {
                padding: 15mm 20mm !important;
                width: 100% !important;
                max-width: 210mm !important; /* A4 Width */
                margin: 0 auto !important;
                display: block !important;
            }
            .print-only-tc {
                display: block !important;
                page-break-before: always !important;
                break-before: page !important;
                padding-top: 15mm !important;
            }
        }
        
        .print-only-tc {
            display: none;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-screen overflow-hidden antialiased selection:bg-primary-500 selection:text-white bg-slate-50">

    <!-- Full Width Header -->
    <header class="w-full bg-slate-900 text-white flex-shrink-0 py-5 px-6 flex items-center justify-center relative z-40 border-b border-slate-800 shadow-xl">
        <!-- Smart 3-Dot Menu Left -->
        <button onclick="app.toggleSidebar()" class="absolute left-6 group flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-4 py-2.5 rounded-full transition-all duration-300 shadow-md border border-slate-700 hover:shadow-lg hover:border-slate-500" title="Open Menu">
            <i class="fas fa-ellipsis-v group-hover:rotate-90 transition-transform duration-300"></i>
            <span class="font-bold tracking-widest text-xs sm:text-sm uppercase">Menu</span>
        </button>

        <!-- Center Brand & Address (3 Colors) -->
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-1">
                <span class="text-blue-500">WADI</span> 
                <span class="text-emerald-500">IT</span> 
                <span class="text-rose-500">TECHNOLOGY</span>
            </h1>
            <p class="text-sm md:text-base text-slate-400 flex items-center justify-center gap-2 mt-1 font-medium">
                <i class="fas fa-map-marker-alt text-primary-500"></i> Dhampara, Wasa, Chittagong.
            </p>
        </div>
    </header>

    <!-- Body Content Wrapper -->
    <div class="flex flex-1 overflow-hidden relative w-full bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMCwwLDAsMC4wMykiLz48L3N2Zz4=')]">

        <!-- Mobile & Desktop Overlay -->
        <div id="mobileOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0" onclick="app.toggleSidebar(false)"></div>

        <!-- Sidebar Drawer -->
        <aside id="sidebar" class="bg-slate-900 text-white w-72 flex-shrink-0 flex flex-col absolute left-0 top-0 h-full z-50 transition-transform duration-400 ease-in-out -translate-x-full shadow-2xl border-r border-slate-800">
            
            <div class="flex justify-between items-center p-6 border-b border-slate-800/60">
                <h2 class="text-sm font-bold text-slate-400 tracking-widest uppercase">Menu Options</h2>
                <button onclick="app.toggleSidebar(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-home w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">Dashboard</span>
                </button>

                <button onclick="app.openNewInvoice()" id="nav-invoice" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-file-invoice w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">1. Invoice</span>
                </button>

                <button onclick="app.navigate('vouchers')" id="nav-vouchers" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-receipt w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">2. Vouchers</span>
                </button>
                
                <button onclick="app.navigate('cashbook')" id="nav-cashbook" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-wallet w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">3. Cash Book</span>
                </button>
                
                <button onclick="app.navigate('settings')" id="nav-settings" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-sliders-h w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">4. Settings</span>
                </button>

                <button onclick="app.navigate('terms')" id="nav-terms" class="nav-item w-full flex items-center px-4 py-4 rounded-xl transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white group">
                    <i class="fas fa-file-contract w-6 text-xl transition-transform group-hover:scale-110 text-center"></i>
                    <span class="font-medium ml-3 text-base">5. Terms & Conditions</span>
                </button>
            </nav>
            
            <!-- Footer -->
            <div class="p-6 border-t border-slate-800/60 text-xs text-center text-slate-500">
                &copy; <span id="year"></span> WADI IT.
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full w-full relative overflow-y-auto">
            
            <!-- Page Title Area -->
            <div class="px-6 lg:px-10 py-5 border-b border-slate-200/50 bg-white/70 backdrop-blur-md sticky top-0 z-30 flex justify-between items-center">
                <h2 id="headerTitle" class="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight drop-shadow-sm">Dashboard</h2>
                
                <!-- Status Badge -->
                <div class="hidden sm:flex items-center text-slate-500 bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm text-sm font-medium">
                    <div class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></div>
                    System Online
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="appContainer" class="flex-1 p-4 sm:p-6 lg:p-10 pb-24">
                <!-- Rendered by JS -->
            </div>

            <!-- Professional Footer -->
            <footer class="mt-auto bg-white/80 backdrop-blur-md border-t border-slate-200 py-6 px-6 lg:px-10 flex flex-col md:flex-row justify-between items-center z-10 relative">
                <div class="text-sm text-slate-500 font-medium mb-4 md:mb-0">
                    &copy; <span id="footerYear"></span> <span class="font-bold text-slate-700">WADI IT Technology</span>. All rights reserved.
                </div>
                <div class="flex gap-4 text-slate-400">
                    <a href="#" class="hover:text-primary-500 transition-colors"><i class="fab fa-facebook text-lg"></i></a>
                    <a href="#" class="hover:text-primary-500 transition-colors"><i class="fab fa-linkedin text-lg"></i></a>
                    <a href="#" class="hover:text-primary-500 transition-colors"><i class="fas fa-globe text-lg"></i></a>
                </div>
            </footer>
        </main>
    </div>

    <!-- Voucher Modal (Hidden by default) -->
    <div id="voucherModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="app.closeModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto fade-in flex flex-col">
            <!-- Modal Header / Controls -->
            <div class="no-print sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 flex justify-between items-center z-10">
                <h3 id="modalTitle" class="font-bold text-slate-700 uppercase tracking-wider">Voucher Document</h3>
                <div class="flex gap-2" id="modalActionButtons">
                    <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                        <i class="fas fa-print mr-2"></i>Print PDF
                    </button>
                    <button onclick="app.closeModal()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                        <i class="fas fa-times mr-2"></i>Close
                    </button>
                </div>
            </div>
            <!-- Modal Content (Injected) -->
            <div id="modalContent" class="p-8 sm:p-12 bg-white">
                <!-- Content goes here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastArea" class="fixed bottom-6 right-6 z-[110] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        if(document.getElementById('footerYear')) {
            document.getElementById('footerYear').textContent = new Date().getFullYear();
        }

        const formatMoney = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'BDT', maximumFractionDigits: 0 }).format(amount);
        const generateId = () => 'INV-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');

        class App {
            constructor() {
                this.state = {
                    editingId: null,
                    currentView: 'dashboard',
                    sidebarOpen: false,
                    taxRate: 5,
                    defaultTerms: 'Thank you for choosing WADI IT TECHNOLOGY. Please process payment within 7 days.',
                    fullTermsDocument: "WADI IT TECHNOLOGY - TERMS AND CONDITIONS\n\n1. All services are subject to a formal agreement.\n2. 50% advance payment is required to initiate project work.\n3. Custom software delivery timelines depend on project scale and client feedback speed.\n4. Annual maintenance covers regular bug fixes but does not include new feature development.\n5. Payments made for digital goods and services are generally non-refundable once work has commenced.\n\nThank you for doing business with us.",
                    services: [
                        { id: 1, name: "Web Application Dev", price: 45000 },
                        { id: 2, name: "E-commerce Solution", price: 60000 },
                        { id: 3, name: "UI/UX Design", price: 25000 },
                        { id: 4, name: "Annual Maintenance", price: 15000 }
                    ],
                    expenseCategories: [
                        { id: 1, name: "Office Rent" },
                        { id: 2, name: "Employee Salary" },
                        { id: 3, name: "Server & Hosting Cost" },
                        { id: 4, name: "Utility Bills" }
                    ],
                    profitCategories: [
                        { id: 1, name: "Direct Client Project" },
                        { id: 2, name: "Domain & Hosting Resell" },
                        { id: 3, name: "Consultation" }
                    ],
                    invoices: [
                        { 
                            id: 'INV-20231020-0001', 
                            type: 'billing',
                            date: new Date(Date.now() - 86400000).toISOString().split('T')[0], 
                            clientName: 'TechNova BD',
                            clientEmail: 'contact@technova.com',
                            clientPhone: '01712345678',
                            note: '',
                            items: [{ id: 1, serviceId: 1, description: 'Web Application Dev', qty: 1, price: 45000 }],
                            subtotal: 45000,
                            tax: 2250,
                            total: 47250,
                            terms: 'Thank you for choosing WADI IT TECHNOLOGY.'
                        }
                    ]
                };
                this.state.draft = this.getEmptyDraft();
                this.init();
            }

            getEmptyDraft() {
                return {
                    type: 'billing',
                    clientName: '',
                    clientEmail: '',
                    clientPhone: '',
                    date: new Date().toISOString().split('T')[0],
                    note: '',
                    terms: this.state.defaultTerms,
                    includeTC: true,
                    items: [] // Start empty, user will check boxes
                };
            }

            init() {
                this.navigate('dashboard');
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 1024 && this.state.sidebarOpen) {
                        this.toggleSidebar(false);
                    }
                });
            }

            openNewInvoice() {
                this.state.editingId = null;
                this.state.draft = this.getEmptyDraft();
                this.navigate('invoice');
            }

            toggleSidebar(forceState) {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('mobileOverlay');
                
                this.state.sidebarOpen = forceState !== undefined ? forceState : !this.state.sidebarOpen;
                
                if (this.state.sidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            }

            navigate(view) {
                this.state.currentView = view;
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('bg-gradient-to-r', 'from-primary-600', 'to-primary-500', 'text-white', 'shadow-md');
                    el.classList.add('text-slate-300');
                });
                
                const activeBtn = document.getElementById(`nav-${view}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-300');
                    activeBtn.classList.add('bg-gradient-to-r', 'from-primary-600', 'to-primary-500', 'text-white', 'shadow-md', 'shadow-primary-500/20');
                }

                const titles = { 
                    dashboard: 'Dashboard Overview',
                    invoice: 'Create New Invoice', 
                    vouchers: 'Saved Vouchers',
                    cashbook: 'Company Cash Book', 
                    settings: 'System Settings',
                    terms: 'Terms & Conditions' 
                };
                document.getElementById('headerTitle').textContent = titles[view] || 'Portal';

                if (window.innerWidth < 1024) this.toggleSidebar(false);

                this.render();
            }

            toast(msg, type = 'success') {
                const area = document.getElementById('toastArea');
                const toast = document.createElement('div');
                const isSuccess = type === 'success';
                
                toast.className = `fade-in-up pointer-events-auto flex items-center p-4 rounded-xl shadow-lg border ${isSuccess ? 'bg-white border-green-200 text-slate-800' : 'bg-red-50 border-red-200 text-red-800'}`;
                toast.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center mr-3 ${isSuccess ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                        <i class="fas ${isSuccess ? 'fa-check' : 'fa-exclamation'}"></i>
                    </div>
                    <div class="font-medium text-sm pr-4">${msg}</div>
                `;
                
                area.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            render() {
                const container = document.getElementById('appContainer');
                container.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.className = 'max-w-6xl mx-auto w-full';

                if (this.state.currentView === 'dashboard') wrapper.innerHTML = this.viewDashboard();
                else if (this.state.currentView === 'invoice') wrapper.innerHTML = this.viewInvoice();
                else if (this.state.currentView === 'vouchers') wrapper.innerHTML = this.viewVouchers();
                else if (this.state.currentView === 'cashbook') wrapper.innerHTML = this.viewCashbook();
                else if (this.state.currentView === 'settings') wrapper.innerHTML = this.viewSettings();
                else if (this.state.currentView === 'terms') wrapper.innerHTML = this.viewTerms();

                container.appendChild(wrapper);
            }

            sendEmailInvoice(id) {
                const invoice = this.state.invoices.find(i => i.id === id);
                if (!invoice) return;
                const docTitle = invoice.type === 'expense' ? 'Expense Voucher' : 
                                 invoice.type === 'profit' ? 'Profit Statement' : 'Tax Invoice';
                const subject = `WADI IT Technology - ${docTitle} (${invoice.id})`;
                const body = `Dear ${invoice.clientName},\n\nPlease find the details of your ${docTitle} (${invoice.id}) referenced in our records.\n\nThank you,\nWADI IT Technology`;
                
                const mailtoLink = `mailto:${invoice.clientEmail || ''}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                window.location.href = mailtoLink;
                this.toast("Opening email client...", "success");
            }

            sendEmailTC() {
                const subject = `WADI IT Technology - Terms & Conditions`;
                const body = `Please review the official Terms and Conditions of WADI IT Technology:\n\n${this.state.fullTermsDocument}`;
                const mailtoLink = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                window.location.href = mailtoLink;
                this.toast("Opening email client...", "success");
            }

            // --- DASHBOARD VIEW ---
            viewDashboard() {
                const earnings = this.state.invoices.filter(i => i.type !== 'expense').reduce((sum, inv) => sum + inv.total, 0);
                const expenses = this.state.invoices.filter(i => i.type === 'expense').reduce((sum, inv) => sum + inv.total, 0);
                const count = this.state.invoices.length;

                return `
                    <div class="space-y-6 fade-in-up">
                        <!-- Smart IT Banner -->
                        <div class="tech-banner rounded-3xl p-10 lg:p-16 text-white shadow-2xl relative overflow-hidden group">
                            <div class="absolute inset-0 bg-blue-900/40 mix-blend-multiply"></div>
                            <div class="absolute -right-20 -top-20 w-64 h-64 bg-primary-500/30 rounded-full blur-3xl group-hover:bg-primary-400/40 transition-all duration-700"></div>
                            
                            <div class="relative z-10 max-w-2xl">
                                <span class="bg-white/20 backdrop-blur-md border border-white/30 text-white text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest mb-6 inline-block">
                                    Welcome to Portal
                                </span>
                                <h1 class="text-4xl lg:text-6xl font-extrabold mb-4 tracking-tight drop-shadow-md">
                                    Smart IT Management
                                </h1>
                                <p class="text-lg text-slate-200 mb-8 font-medium max-w-xl drop-shadow">
                                    Manage your invoices, vouchers, and cash book efficiently in one unified, intelligent platform tailored for WADI IT Technology.
                                </p>
                                <div class="flex gap-4">
                                    <button onclick="app.openNewInvoice()" class="bg-white text-slate-900 hover:bg-slate-100 px-6 py-3 rounded-xl font-bold shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                                        <i class="fas fa-plus"></i> New Invoice
                                    </button>
                                    <button onclick="app.navigate('vouchers')" class="bg-primary-600/80 backdrop-blur-md border border-primary-500 hover:bg-primary-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2">
                                        <i class="fas fa-folder-open"></i> View Vouchers
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Quick Stats -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 stagger-1 fade-in-up">
                            <div class="bg-white p-6 rounded-2xl shadow-soft border border-slate-100 flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl"><i class="fas fa-file-invoice"></i></div>
                                <div>
                                    <p class="text-sm font-bold text-slate-400 uppercase">Total Vouchers</p>
                                    <p class="text-2xl font-extrabold text-slate-800">${count}</p>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-soft border border-slate-100 flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i class="fas fa-wallet"></i></div>
                                <div>

                                <input type="number" min="0" value="${item.price}" onchange="app.updateItem('${item.id}', 'price', parseFloat(this.value)||0)" class="w-full text-sm rounded-xl border-amber-200 focus:border-amber-500 p-2.5 border text-right bg-white shadow-sm">

                            <button onclick="app.removeItem('${item.id}')" class="hidden md:flex text-slate-300 hover:text-red-500 p-2 transition-all hover:bg-red-50 rounded-lg self-end h-[42px] items-center justify-center w-10 shrink-0" title="Remove">
                                <i class="fas fa-trash-alt"></i>
                            </button>

                    </div>
                `).join('');

                return `
                    <div class="fade-in-up glass-panel rounded-2xl shadow-soft border border-white/50 overflow-hidden">
                        
                        <!-- Top Bar -->
                        <div class="bg-gradient-to-r from-slate-900 to-slate-800 p-6 lg:p-10 flex flex-col md:flex-row justify-between items-start md:items-center relative overflow-hidden">
                            <div class="absolute z-10">
                                <span class="bg-primary-500/20 text-primary-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block border border-primary-500/30">

                                <button onclick="app.updateDraft('type', 'expense')" class="px-5 py-2.5 rounded-xl font-bold text-sm border-2 transition-all flex items-center gap-2 ${this.state.draft.type === 'expense' ? 'border-rose-500 bg-rose-50 text-rose-700 shadow-sm' : 'border-slate-200 text-slate-500 hover:border-slate-300 bg-white'}">
                                    <i class="fas fa-hand-holding-usd"></i> Expense
                                </button>
                                <button onclick="app.updateDraft('type', 'profit')" class="px-5 py-2.5 rounded-xl font-bold text-sm border-2 transition-all flex items-center gap-2 ${this.state.draft.type === 'profit' ? 'border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm' : 'border-slate-200 text-slate-500 hover:border-slate-300 bg-white'}">
                                    <i class="fas fa-chart-line"></i> Profit
                                </button>
                            </div>
                        </div>

                        <!-- Info Grid -->
                        <div class="p-6 lg:p-10 grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-16 border-b border-slate-100 bg-white/40">
                            <div class="space-y-4">
                                <h3 class="text-xs font-bold text-primary-600 uppercase tracking-widest flex items-center mb-4">
                                    <i class="fas ${isExpense ? 'fa-building' : 'fa-user-tie'} mr-2"></i> ${isExpense ? 'Payee / Vendor Info' : isProfit ? 'Source Info' : 'Billed To'}
                                </h3>
                                <div>
                                    <input type="text" placeholder="${isExpense ? 'Payee Name' : 'Client Name or Company Name'}" value="${this.state.draft.clientName}" onchange="app.updateDraft('clientName', this.value)" class="w-full text-base rounded-xl border-slate-200 shadow-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 p-3.5 border font-semibold bg-white">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <input type="email" placeholder="Email Address" value="${this.state.draft.clientEmail}" onchange="app.updateDraft('clientEmail', this.value)" class="w-full text-sm rounded-xl border-slate-200 shadow-sm focus:border-primary-500 p-3 border bg-white">
                                    </div>
                                    <div>
                                        <input type="tel" placeholder="Phone Number" value="${this.state.draft.clientPhone}" onchange="app.updateDraft('clientPhone', this.value)" class="w-full text-sm rounded-xl border-slate-200 shadow-sm focus:border-primary-500 p-3 border bg-white">
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <h3 class="text-xs font-bold text-primary-600 uppercase tracking-widest flex items-center mb-4">
                                    <i class="fas fa-file-alt mr-2"></i> Document Details

                                <div class="bg-white rounded-xl border border-slate-200 p-1 flex shadow-sm items-center">
                                    <span class="bg-slate-50 text-slate-500 text-sm font-semibold px-4 py-3.5 rounded-lg border-r border-slate-200 flex-shrink-0">Date</span>
                                    <input type="date" value="${this.state.draft.date}" onchange="app.updateDraft('date', this.value)" class="w-full text-base p-3.5 bg-transparent border-none focus:ring-0 text-slate-700 font-medium">
                                </div>
                                <div>
                                    <input type="text" placeholder="Internal Note / Cost Details (Optional)" value="${this.state.draft.note}" onchange="app.updateDraft('note', this.value)" class="w-full text-base sm:text-sm rounded-xl border-slate-200 shadow-sm focus:border-primary-500 p-3.5 border bg-white mt-1">
                                </div>
                            </div>
                        </div>

                        <!-- Checkbox Items Table -->
                        <div class="bg-white/60">
                            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex items-center gap-2">
                                <i class="fas fa-list-check text-slate-400"></i>
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">${listLabel}</label>
                            </div>
                            
                            ${predefinedHtml}
                            ${customHtml}

                            <div class="p-4 lg:p-6 bg-slate-50/50 border-b border-slate-100 flex justify-center">
                                <button onclick="app.addCustomItem()" class="inline-flex items-center justify-center px-6 py-3.5 text-sm font-bold text-slate-700 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 rounded-xl transition-all shadow-sm active:scale-95">
                                    <i class="fas fa-plus text-primary-500 mr-2"></i> Add Custom Entry
                                </button>
                            </div>
                        </div>

                        <!-- Footer / Totals -->
                        <div class="p-6 lg:p-10 flex flex-col md:flex-row justify-between items-start gap-10 bg-white">
                            <div class="w-full md:w-1/2">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Short Terms / Footer Note</label>
                                <textarea onchange="app.updateDraft('terms', this.value)" class="w-full text-sm rounded-xl border-slate-200 shadow-sm focus:border-primary-500 p-4 border bg-slate-50 focus:bg-white transition-colors min-h-[120px]">${this.state.draft.terms}</textarea>
                                
                                <div class="mt-4 flex items-center gap-2">
                                    <input type="checkbox" id="includeTCCheckbox" ${this.state.draft.includeTC !== false ? 'checked' : ''} onchange="app.updateDraft('includeTC', this.checked)" class="w-5 h-5 text-primary-600 rounded border-slate-300 focus:ring-primary-500 cursor-pointer">
                                    <label for="includeTCCheckbox" class="text-sm font-bold text-slate-700 cursor-pointer select-none">Include Full T&C Page in Print</label>
                                </div>
                                <p class="text-xs text-slate-400 mt-2"><i class="fas fa-info-circle"></i> If checked, the full detailed Terms & Conditions document will be appended automatically as a new page during print.</p>
                            </div>

                                        <span>Subtotal</span>
                                        <span class="text-slate-800">${formatMoney(subtotal)}</span>
                                    </div>
                                    ${isBilling ? `
                                    <div class="flex justify-between text-sm text-slate-500 font-medium">
                                        <span>VAT / Tax (${this.state.taxRate}%)</span>
                                        <span class="text-slate-800">${formatMoney(tax)}</span>
                                    </div>` : ''}
                                    <div class="h-px bg-slate-200 w-full my-4"></div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-base font-bold text-slate-800 uppercase tracking-wide">Grand Total</span>
                                        <span class="text-2xl font-extrabold text-primary-600 tracking-tight">${formatMoney(total)}</span>
                                    </div>
                                </div>
                                
                                <button onclick="app.saveInvoice()" class="mt-8 w-full group relative overflow-hidden bg-slate-900 text-white font-semibold py-4 px-6 rounded-xl shadow-xl shadow-slate-900/20 transition-all hover:shadow-slate-900/40 hover:-translate-y-0.5 flex justify-center items-center gap-3">
                                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-emerald-500 to-emerald-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    <i class="fas fa-save relative z-10 text-lg"></i>
                                    <span class="relative z-10">${this.state.editingId ? 'Update & Save Document' : 'Generate & Save Document'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            updateDraft(field, val) { 
                this.state.draft[field] = val; 
                if (field === 'type') {
                    // Reset selected items when changing document type
                    this.state.draft.items = [];
                    this.render();
                }
            }
            
            toggleServiceCheckbox(serviceId) {
                const list = this.state.draft.type === 'billing' ? this.state.services : 
                             this.state.draft.type === 'expense' ? this.state.expenseCategories : 
                             this.state.profitCategories;
                
                const svc = list.find(s => s.id == serviceId);
                const existingIdx = this.state.draft.items.findIndex(i => i.serviceId === serviceId);
                
                if (existingIdx >= 0) {
                    // Remove from list
                    this.state.draft.items.splice(existingIdx, 1);
                } else if (svc) {
                    // Add to list
                    this.state.draft.items.push({
                        id: 'item_' + Date.now() + Math.floor(Math.random() * 1000),
                        serviceId: svc.id,
                        description: svc.name,
                        qty: 1,
                        price: this.state.draft.type === 'billing' ? (svc.price || 0) : 0
                    });
                }
                this.render();
            }

            updateItem(id, field, val) {
                const item = this.state.draft.items.find(i => i.id === id);
                if (item) {
                    item[field] = val;
                    this.render();
                }
            }

            addCustomItem() {
                this.state.draft.items.push({ 
                    id: 'custom_item_' + Date.now(), 
                    serviceId: 'custom_' + Date.now(), 
                    description: '', 
                    qty: 1, 
                    price: 0 
                });
                this.render();
            }

            removeItem(id) {
                this.state.draft.items = this.state.draft.items.filter(i => i.id !== id);
                this.render();
            }

            saveInvoice() {
                if (!this.state.draft.clientName.trim()) {
                    this.toast("Name/Payee field is required.", "error");
                    return;
                }
                
                if (this.state.draft.items.length === 0) {
                    this.toast("Please select at least one item or service.", "error");
                    return;
                }

                let subtotal = this.state.draft.items.reduce((s, i) => s + (i.qty * i.price), 0);
                let tax = (this.state.draft.type === 'billing') ? (subtotal * this.state.taxRate) / 100 : 0;
                let total = subtotal + tax;

                if (total <= 0) {
                    this.toast("Document total must be greater than zero.", "error");
                    return;
                }

                // Deep copy items
                const savedItems = JSON.parse(JSON.stringify(this.state.draft.items));

                const newInvoice = {
                    id: this.state.editingId || generateId(),
                    type: this.state.draft.type,
                    date: this.state.draft.date,
                    clientName: this.state.draft.clientName,
                    clientEmail: this.state.draft.clientEmail,
                    clientPhone: this.state.draft.clientPhone,
                    note: this.state.draft.note,
                    items: savedItems,
                    subtotal: subtotal,
                    tax: tax,
                    total: total,
                    terms: this.state.draft.terms,
                    includeTC: this.state.draft.includeTC !== false
                };

                if (this.state.editingId) {
                    const index = this.state.invoices.findIndex(i => i.id === this.state.editingId);
                    if(index !== -1) {
                        this.state.invoices[index] = newInvoice;
                        this.toast(`Document ${newInvoice.id} updated successfully.`);
                    }
                    this.state.editingId = null;
                } else {
                    this.state.invoices.unshift(newInvoice);
                    this.toast(`Document ${newInvoice.id} generated! Saved to Vouchers & Cash Book.`);
                    
                    // Simulate automatic email sending
                    if (newInvoice.clientEmail) {
                        setTimeout(() => this.toast(`Automated Email dispatched to ${newInvoice.clientEmail}`, "success"), 1500);
                    }
                }

                this.state.draft = this.getEmptyDraft();
                
                setTimeout(() => this.navigate('vouchers'), 1000);
            }

            editVoucher(id) {
                const invoice = this.state.invoices.find(i => i.id === id);
                if (!invoice) return;
                this.state.editingId = id;
                this.state.draft = JSON.parse(JSON.stringify(invoice));
                this.navigate('invoice');
            }

            confirmDelete(id) {
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] flex items-center justify-center p-4 fade-in';
                overlay.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full shadow-2xl fade-in-up text-center">
                        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">Delete Voucher?</h3>
                        <p class="text-slate-500 text-sm mb-6">Are you sure you want to delete ${id}? This will remove it from the Cash Book and Vouchers.</p>
                        <div class="flex gap-3">

                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                document.getElementById('cancelDelBtn').onclick = () => overlay.remove();

                    this.state.invoices = this.state.invoices.filter(i => i.id !== id);

            // --- CASHBOOK VIEW ---
            viewCashbook() {
                // Calculate Running Balances (Oldest to Newest)
                let balance = 0;
                const ledgerEntries = [...this.state.invoices].reverse().map(inv => {
                    const isCredit = inv.type === 'expense'; // Money Out
                    const isDebit = !isCredit;               // Money In (Billing / Profit)
                    
                    const dr = isDebit ? inv.total : 0;
                    const cr = isCredit ? inv.total : 0;
                    
                    balance += (dr - cr);
                    
                    return { ...inv, dr, cr, balance };
                }).reverse(); // Reverse back for newest first display

                const tableRows = ledgerEntries.length === 0 ? 
                    `<tr><td colspan="7" class="px-6 py-12 text-center text-slate-500 font-medium bg-white">No transactions recorded.</td></tr>` :
                    ledgerEntries.map((inv, idx) => `
                    <tr class="hover:bg-primary-50/50 transition-colors border-b border-slate-100 bg-white stagger-${(idx%3)+1} fade-in-up">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-medium">${inv.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button onclick="app.openModal('${inv.id}')" class="text-sm font-bold text-primary-600 hover:text-primary-800 hover:underline flex items-center gap-1">
                                ${inv.id} <i class="fas fa-external-link-alt text-[10px]"></i>
                            </button>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="text-sm text-slate-700 font-medium block truncate max-w-[150px]">${inv.clientName}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2.5 py-1 text-[10px] font-bold rounded uppercase tracking-wider ${
                                inv.type === 'expense' ? 'bg-rose-100 text-rose-700' :
                                inv.type === 'profit' ? 'bg-emerald-100 text-emerald-700' :
                                'bg-blue-100 text-blue-700'
                            }">${inv.type}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right font-bold text-emerald-600 text-sm">
                            ${inv.dr ? formatMoney(inv.dr) : '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right font-bold text-rose-500 text-sm">
                            ${inv.cr ? formatMoney(inv.cr) : '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right font-bold text-slate-800 text-base bg-slate-50/50">
                            ${formatMoney(inv.balance)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <button onclick="app.editVoucher('${inv.id}')" class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-2 rounded transition-colors mr-1" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="app.confirmDelete('${inv.id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded transition-colors" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                return `
                    <div class="space-y-6">
                        <div class="fade-in-up glass-panel rounded-2xl shadow-soft border border-white overflow-hidden">
                            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white/50">
                                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                                    <i class="fas fa-book text-primary-500 mr-2"></i> Standard Cash Book Ledger
                                </h3>
                                <span class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Double-Entry View</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full">
                                    <thead class="bg-slate-50/80 border-b border-slate-200">
                                        <tr>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Date</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Ref No.</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Details</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Type</th>
                                            <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-emerald-600 uppercase tracking-wider">Dr (In)</th>
                                            <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-rose-500 uppercase tracking-wider">Cr (Out)</th>
                                            <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-slate-700 uppercase tracking-wider">Balance</th>
                                            <th scope="col" class="px-6 py-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">Actions</th>

                `;
            }

                                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                                    <h3 class="text-sm font-bold text-slate-800 flex items-center"><i class="fas fa-boxes text-blue-500 mr-2"></i> Billing Services</h3>
                                </div>
                                <div class="p-4 bg-white border-b border-slate-100 shrink-0">
                                    <div class="flex gap-2">
                                        <input type="text" id="add_services_name" placeholder="Service Name" class="w-full text-sm rounded-lg border-slate-200 p-2 border">
                                        <input type="number" id="add_services_price" placeholder="Rate" class="w-24 text-sm rounded-lg border-slate-200 p-2 border">
                                        <button onclick="app.addCategory('services')" class="bg-blue-600 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>

                                    ${genListHtml(this.state.services, 'services', true)}

                            <!-- Expense Manager -->
                            <div class="glass-panel rounded-2xl shadow-soft border border-white overflow-hidden flex flex-col max-h-[300px]">

                    this.state.taxRate = val;
                    this.toast(`Global tax rate set to ${val}%`);
                } else this.toast("Invalid tax percentage.", "error");
            }

            saveFullTerms() {
                const val = document.getElementById('fullTermsInput').value;
                this.state.fullTermsDocument = val;
                this.toast("Full Terms & Conditions Paper Saved!");
            }

            addCategory(type) {
                const nameInput = document.getElementById(`add_${type}_name`);
                const name = nameInput.value.trim();
                
                if(!name) {
                    this.toast("Name cannot be empty.", "error");
                    return;
                }

                const newItem = { id: Date.now(), name };
                
                if (type === 'services') {
                    const price = parseFloat(document.getElementById(`add_${type}_price`).value) || 0;
                    newItem.price = price;
                }
                
                this.state[type].push(newItem);
                this.toast("Item added successfully.");
                this.render();
            }

            delCategory(type, id) {
                this.state[type] = this.state[type].filter(s => s.id != id);
                this.toast("Item removed.");
                this.render();
            }

            // --- EMAIL CLIENT ---
            sendEmail(id) {
                const invoice = this.state.invoices.find(i => i.id === id);
                if (!invoice) return;
                
                if (!invoice.clientEmail) {
                    this.toast("No email address provided for this client.", "error");
                    return;
                }
                
                const subject = encodeURIComponent(`Document ${id} from WADI IT Technology`);
                const body = encodeURIComponent(`Dear ${invoice.clientName},\n\nPlease find the details for your recent document (${id}) below.\n\nTotal Amount: ${formatMoney(invoice.total)}\n\nPlease let us know if you have any questions.\n\nBest Regards,\nWADI IT Technology`);
                
                window.location.href = `mailto:${invoice.clientEmail}?subject=${subject}&body=${body}`;
            }

                content.innerHTML = `

                            <span class="text-blue-600">WADI</span>

                    <div class="mb-8 bg-amber-50 border border-amber-200 p-4 rounded-xl">
                        <h4 class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1">Document Note / Cost Details</h4>
                        <p class="text-sm text-amber-900">${invoice.note}</p>
                    </div>` : ''}

                    <table class="w-full mb-10">
                        <thead>
                            <tr class="border-b-2 border-slate-800 text-left">
                                <th class="py-3 text-xs font-bold text-slate-500 uppercase">Description</th>
                                <th class="py-3 text-xs font-bold text-slate-500 uppercase text-center">Qty</th>
                                <th class="py-3 text-xs font-bold text-slate-500 uppercase text-right">Rate</th>
                                <th class="py-3 text-xs font-bold text-slate-500 uppercase text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsList}
                        </tbody>
                    </table>

                    <div class="flex flex-col md:flex-row justify-between items-start gap-8">
                        <div class="w-full md:w-1/2">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Short Terms</h3>
                            <p class="text-sm text-slate-600 bg-slate-50 p-4 rounded-lg border border-slate-100">${invoice.terms || 'N/A'}</p>
                        </div>
                        <div class="w-full md:w-[300px] border border-slate-200 rounded-xl p-5 bg-slate-50/50">
                            <div class="flex justify-between mb-3 text-sm font-medium text-slate-600">
                                <span>Subtotal</span>
                                <span>${formatMoney(invoice.subtotal)}</span>
                            </div>
                            ${isBilling ? `
                            <div class="flex justify-between mb-4 text-sm font-medium text-slate-600">
                                <span>Tax / VAT</span>
                                <span>${formatMoney(invoice.tax)}</span>
                            </div>` : ''}
                            <div class="flex justify-between items-center border-t border-slate-200 pt-3">
                                <span class="text-lg font-bold text-slate-800">Total</span>
                                <span class="text-xl font-extrabold text-primary-600">${formatMoney(invoice.total)}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-16 pt-8 border-t border-slate-100 text-center flex justify-between px-10">
                        <div class="w-40 border-t-2 border-slate-300 pt-2 text-sm font-bold text-slate-500">${isBilling ? 'Client Signature' : 'Receiver Signature'}</div>
                        <div class="w-40 border-t-2 border-slate-300 pt-2 text-sm font-bold text-slate-500">Authorized Signature</div>
                    </div>

                    <!-- Appended Full Terms & Conditions Paper (Prints on new page) -->
                    ${invoice.includeTC !== false ? `
                    <div class="print-only-tc border-t-8 border-slate-900 pt-10 bg-white">
                        <div class="text-center mb-10 pb-6 border-b-2 border-slate-100">
                            <h1 class="text-3xl md:text-5xl font-black tracking-tighter mb-2">
                                <span class="text-blue-600">WADI</span> 
                                <span class="text-emerald-600">IT</span> 
                                <span class="text-rose-600">TECHNOLOGY</span>
                            </h1>
                            <p class="text-slate-500 font-medium mb-6">Dhampara, Wasa, Chittagong</p>
                            <span class="px-5 py-2 border-2 rounded-lg font-bold tracking-widest uppercase text-sm border-slate-200 text-slate-600 bg-slate-50">
                                TERMS & CONDITIONS
                            </span>
                        </div>
                        <div class="text-sm text-slate-800 whitespace-pre-wrap leading-loose font-medium px-10">
                            ${this.state.fullTermsDocument}
                        </div>
                        
                        <div class="mt-24 pt-8 border-t border-slate-100 text-center flex justify-end px-10">
                            <div class="w-48 border-t-2 border-slate-300 pt-2 text-sm font-bold text-slate-500">Authorized Signature</div>
                        </div>
                    </div>` : ''}
                `;

                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }

            closeModal() {
                document.body.classList.remove('printing-modal');
                const modal = document.getElementById('voucherModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        const app = new App();
    </script>
</body>
</html>
